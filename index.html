                obstacles.splice(selectedObstacleIndex, 1);
                selectedObstacleIndex = -1;
                saveHistory();
                uiSync();
                renderList();
                draw();
            }
        }

        function uiUpdateObstacle() {
            if (selectedObstacleIndex === -1) return;
            const obs = obstacles[selectedObstacleIndex];
            obs.name = document.getElementById('obs-name').value;
            
            if (obs.type === 'rectangle' || !obs.type) {
                obs.x = parseFloat(document.getElementById('obs-x').value) || 0;
                obs.y = parseFloat(document.getElementById('obs-y').value) || 0;
                obs.w = parseFloat(document.getElementById('obs-w').value) || 0;
                obs.h = parseFloat(document.getElementById('obs-h').value) || 0;
            } else if (obs.type === 'circle') {
                obs.x = parseFloat(document.getElementById('obs-x').value) || 0;
                obs.y = parseFloat(document.getElementById('obs-y').value) || 0;
                obs.r = parseFloat(document.getElementById('obs-r').value) || 0;
            } else if (obs.type === 'polygon') {
                 // For now, polygon vertex editing is not in the sidebar inputs
                 // But we might want to allow shifting the whole polygon by X/Y
                 const newX = parseFloat(document.getElementById('obs-x').value) || 0;
                 const newY = parseFloat(document.getElementById('obs-y').value) || 0;
                 const dx = newX - obs.x;
                 const dy = newY - obs.y;
                 if (dx !== 0 || dy !== 0) {
                     obs.points.forEach(p => { p.x += dx; p.y += dy; });
                     obs.x = newX;
                     obs.y = newY;
                 }
            }
            
            runSimulation();
            renderList();
            draw();
        }

        function renamePath(v) { paths[currentPathId].name = v; updatePathDropdown(); }
        function deleteSelected() { paths[currentPathId].points.splice(selectedIndex, 1); selectedIndex = -1; saveHistory(); renderList(); draw(); }

        function exportCode() {
            let res = "public class Waypoints {\n";
            // Export Shared Links first
            res += "  /* Linked Waypoints */\n";
            Object.keys(linkedWaypoints).forEach(name => {
                const ld = linkedWaypoints[name];
                res += `  public static final Pose2d ${name.replace(/\s+/g, '_').toUpperCase()} = new Pose2d(${ld.x.toFixed(3)}, ${ld.y.toFixed(3)}, Rotation2d.fromDegrees(${Math.round(ld.rot)}));\n`;
            });
            res += "\n  /* Path Specific Waypoints */\n";
            Object.values(paths).forEach(p => {
                res += `  // Path: ${p.name}\n`;
                p.points.forEach(wp => {
                    if (!wp.isLinked) {
                        res += `  public static final Pose2d ${wp.name.replace(/\s+/g, '_').toUpperCase()} = new Pose2d(${wp.x.toFixed(3)}, ${wp.y.toFixed(3)}, Rotation2d.fromDegrees(${Math.round(wp.rot)}));\n`;
                    }
                });
            });
            res += "}";
            document.getElementById('java-output').value = res;
            document.getElementById('code-modal').style.display = 'flex';
        }

        function updateMotorPreset(preset) {
            if (preset === 'kraken_foc') {
                config.motorStallTorque = 9.3615;
                config.motorFreeSpeedRpm = 5784.65;
                config.motorStallCurrent = 476.1;
            } else if (preset === 'kraken') {
                config.motorStallTorque = 7.1573;
                config.motorFreeSpeedRpm = 6065.33;
                config.motorStallCurrent = 374.4;
            }
            // Update input fields to show new values
            document.getElementById('motor-stall-torque-input').value = config.motorStallTorque;
            document.getElementById('motor-free-speed-input').value = config.motorFreeSpeedRpm;
            // Re-run simulation with new motor
            runSimulation();
            draw();
        }

        function updateRobotConfig() {
            // Robot dimensions
            config.robotLength = parseFloat(document.getElementById('robot-length-input').value) || 0.8;
            config.robotWidth = parseFloat(document.getElementById('robot-width-input').value) || 0.8;

            // Physics
            config.maxVelocity = parseFloat(document.getElementById('max-vel-input').value) || 4.287;
            config.maxFriction = parseFloat(document.getElementById('max-fric-input').value) || 1.0;
            config.driveBaseRadius = parseFloat(document.getElementById('drive-radius-input').value) || 0.4;

            // Motor parameters
            config.motorStallTorque = parseFloat(document.getElementById('motor-stall-torque-input').value) || 9.3615;
            config.motorFreeSpeedRpm = parseFloat(document.getElementById('motor-free-speed-input').value) || 5784.65;
            config.statorCurrentLimit = parseFloat(document.getElementById('current-limit-input').value) || 150.0;

            // Drivetrain
            config.gearRatio = parseFloat(document.getElementById('gear-ratio-input').value) || 6.746;
            config.wheelRadius = parseFloat(document.getElementById('wheel-radius-input').value) || 0.0483;
            config.robotMass = parseFloat(document.getElementById('robot-mass-input').value) || 56.7;

            // Tolerances
            config.waypointTolerance = parseFloat(document.getElementById('waypoint-tolerance-input').value) || 0.15;
            config.positionTolerance = parseFloat(document.getElementById('position-tolerance-input').value) || 0.02;
            config.reactionTime = parseFloat(document.getElementById('reaction-time-input').value) || 0.03;

            // Re-run simulation with new parameters
            runSimulation();
            draw();
        }

        // --- Added Features ---
        function saveProject() {
            const data = {
                paths, linkedWaypoints, obstacles, config, 
                fieldWidth, fieldImageSrc, 
                gridEnabled, snapEnabled, gridSize
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "waypoint_project.json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadProject(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    paths = data.paths || paths;
                    linkedWaypoints = data.linkedWaypoints || linkedWaypoints;
                    obstacles = data.obstacles || [];
                    config = { ...config, ...(data.config || {}) };
                    
                    if (data.fieldWidth) fieldWidth = data.fieldWidth;
                    
                    if (data.gridEnabled !== undefined) gridEnabled = data.gridEnabled;
                    if (data.snapEnabled !== undefined) snapEnabled = data.snapEnabled;
                    if (data.gridSize !== undefined) gridSize = data.gridSize;
                    
                    // Update UI controls
                    document.getElementById('grid-btn').innerText = "Grid: " + (gridEnabled ? "On" : "Off");
                    document.getElementById('grid-controls').style.display = gridEnabled ? "block" : "none";
                    document.getElementById('snap-check').checked = snapEnabled;
                    document.getElementById('grid-size').value = gridSize;
                    
                    // Handle image load last
                    if (data.fieldImageSrc && data.fieldImageSrc !== fieldImageSrc) {
                        fieldImageSrc = data.fieldImageSrc;
                        img.src = fieldImageSrc; 
                        // img.onload will trigger draw loop and saveHistory
                    } else {
                        // Just update state
                        currentPathId = Object.keys(paths)[0];
                        selectedIndex = -1;
                        updatePathDropdown();
                        syncPathHeaderUI();
                        playbackTime = 0;
                        updatePlaybackUI();
                        renderList();
                        saveHistory();
                        draw();
                    }

                } catch (err) {
                    alert("Failed to load project: " + err);
                }
            };
            reader.readAsText(file);
            document.getElementById('file-input').value = '';
        }

        function toggleGrid() {
            gridEnabled = !gridEnabled;
            document.getElementById('grid-btn').innerText = "Grid: " + (gridEnabled ? "On" : "Off");
            document.getElementById('grid-controls').style.display = gridEnabled ? "block" : "none";
            saveHistory();
            draw();
        }

        function toggleSnap() {
            snapEnabled = document.getElementById('snap-check').checked;
            saveHistory();
        }

        function updateGridSize() {
            gridSize = parseFloat(document.getElementById('grid-size').value) || 1.0;
            saveHistory();
            draw();
        }
        
        function updateFieldConfig() {
            fieldWidth = parseFloat(document.getElementById('field-width-input').value) || 17.55;
            saveHistory();
            draw();
        }
        
        function uploadFieldImage(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                fieldImageSrc = e.target.result;
                img.src = fieldImageSrc;
                saveHistory();
            };
            reader.readAsDataURL(file);
        }

        function insertWaypointAfter() {
            if (selectedIndex === -1) return;
            const pts = paths[currentPathId].points;
            
            // Current point
            const curr = pts[selectedIndex];
            const currData = curr.isLinked ? linkedWaypoints[curr.name] : curr;
            
            // Next point (if exists)
            const nextIndex = selectedIndex + 1;
            let nextData = currData; // Default to same spot if end
            
            if (nextIndex < pts.length) {
                const next = pts[nextIndex];
                nextData = next.isLinked ? linkedWaypoints[next.name] : next;
            } else {
                // If at end, offset slightly so it's visible
                nextData = { x: currData.x + 0.5, y: currData.y, rot: currData.rot };
            }

            // Midpoint
            const midX = (currData.x + nextData.x) / 2;
            const midY = (currData.y + nextData.y) / 2;

            const newPoint = { 
                name: "WP_" + Date.now().toString().slice(-4), 
                x: midX, 
                y: midY, 
                rot: currData.rot, 
                isLinked: false 
            };
            
            pts.splice(selectedIndex + 1, 0, newPoint);
            selectedIndex = selectedIndex + 1; // Select the new point
            
            saveHistory();
            renderList();
            draw();
        }
    </script>
</body>

</html>
