name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      embeds:
        description: "Also check that GitHub embeds resolve"
        type: boolean
        default: false

jobs:
  test:
    name: Format, lint, type-check, test, prose, spell, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Prose lint
        run: pnpm run prose

      - name: Spell check
        run: pnpm run spell

      - name: Build
        run: pnpm run build

  # Manual only. No lesson embeds a Workshop-Code file today, so a nightly run
  # of this checked nothing. It talks to the GitHub API and can fail on a rate
  # limit, which is why it is a separate job. Put a schedule back when embeds
  # return: they break when a Workshop-Code branch is rewritten, which happens
  # in another repository with no push to this one.
  embeds:
    name: Verify GitHub embeds resolve
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.embeds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check embeds
        run: pnpm run check-embeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
