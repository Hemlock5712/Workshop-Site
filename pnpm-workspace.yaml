# Single-package repo, but pnpm 9.15+ requires `packages` when this file
# exists (for the `overrides` block below). Declare the root as the sole
# workspace member to satisfy the check without changing install behavior.
packages:
  - "."

overrides:
  js-yaml@>=4.0.0 <4.1.1: '>=4.1.1'
  jws@=4.0.0: '>=4.0.1'
  mdast-util-to-hast@>=13.0.0 <13.2.1: '>=13.2.1'
  next@>=15.0.0-canary.0 <15.4.7: '>=15.4.7'
  next@>=15.4.0-canary.0 <15.4.8: '>=15.4.8'
  prismjs@<1.30.0: '>=1.30.0'
